<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" font-family="Segoe UI, Arial, sans-serif" font-size="10">
  <rect x="0.5" y="0.5" width="419" height="149" fill="#fff" stroke="#a6a6a6"/>
  <rect x="0.5" y="0.5" width="419" height="20" fill="#f3f3f3" stroke="#a6a6a6"/>
  <text x="8" y="14" font-size="11" fill="#222">Filter and Sort</text>
  <text x="394" y="14" font-size="11" fill="#555">?  ×</text>
  <g transform="translate(8,28)">
    <rect x="0" y="0" width="70" height="16" fill="#e6e6e6" stroke="#a6a6a6"/>
    <text x="10" y="12" fill="#222">Filter Records</text>
    <rect x="72" y="0" width="60" height="16" fill="#f5f5f5" stroke="#a6a6a6"/>
    <text x="82" y="12" fill="#222">Sort Records</text>
  </g>
  <!-- header row -->
  <g transform="translate(8,50)">
    <rect x="40" y="0" width="120" height="16" fill="#f3f3f3" stroke="#a6a6a6"/><text x="48" y="12" fill="#222">Field:</text>
    <rect x="160" y="0" width="120" height="16" fill="#f3f3f3" stroke="#a6a6a6"/><text x="168" y="12" fill="#222">Comparison:</text>
    <rect x="280" y="0" width="120" height="16" fill="#f3f3f3" stroke="#a6a6a6"/><text x="288" y="12" fill="#222">Compare to:</text>
  </g>
  <!-- row 1 -->
  <g transform="translate(8,68)">
    <rect x="0" y="0" width="40" height="18" fill="#fff" stroke="#a6a6a6"/>
    <rect x="40" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/><text x="46" y="13" fill="#222">DateJoined</text><text x="150" y="13" fill="#666">▾</text>
    <rect x="160" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/><text x="166" y="13" fill="#222">Greater than or equal</text><text x="270" y="13" fill="#666">▾</text>
    <rect x="280" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/><text x="286" y="13" fill="#222">2000/01/01</text>
  </g>
  <!-- row 2 -->
  <g transform="translate(8,88)">
    <rect x="0" y="0" width="40" height="18" fill="#fff" stroke="#a6a6a6"/><text x="6" y="13" fill="#222">And</text><text x="30" y="13" fill="#666">▾</text>
    <rect x="40" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/><text x="46" y="13" fill="#222">DateJoined</text><text x="150" y="13" fill="#666">▾</text>
    <rect x="160" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/><text x="166" y="13" fill="#222">Less than or equal</text><text x="270" y="13" fill="#666">▾</text>
    <rect x="280" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/><text x="286" y="13" fill="#222">2020/12/31</text>
  </g>
  <!-- row 3 (empty And) -->
  <g transform="translate(8,108)">
    <rect x="0" y="0" width="40" height="18" fill="#fff" stroke="#a6a6a6"/><text x="6" y="13" fill="#222">And</text><text x="30" y="13" fill="#666">▾</text>
    <rect x="40" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/>
    <rect x="160" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/>
    <rect x="280" y="0" width="120" height="18" fill="#fff" stroke="#a6a6a6"/>
  </g>
</svg>
