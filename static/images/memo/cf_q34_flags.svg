<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 130" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <style>
    .lbl { font-weight: bold; }
    .col { font-weight: bold; text-decoration: underline; }
    .op  { fill: #444; font-size: 12px; }
    .box { fill: #fff; stroke: #888; stroke-width: 1; }
    .drop { fill: #f3f3f3; stroke: #888; stroke-width: 1; }
    .icon { fill: #fff; stroke: #888; stroke-width: 1; }
    .arrow { fill: #000; }
    .tri  { fill: #fff; stroke: #444; stroke-width: 1; }
    .caret { fill: #444; }
  </style>

  <!-- Column header labels -->
  <text x="120" y="14" class="col">Icon</text>
  <text x="430" y="14" class="col">Value</text>
  <text x="560" y="14" class="col">Type</text>

  <!-- Row 1: Red -->
  <text x="0"   y="40" class="lbl" fill="#000">Red</text>
  <!-- arrow -->
  <line x1="40" y1="36" x2="78" y2="36" stroke="#000" stroke-width="2"/>
  <polygon points="78,30 90,36 78,42" class="arrow"/>
  <!-- icon box -->
  <rect x="100" y="22" width="60" height="28" class="icon"/>
  <polygon points="115,30 115,46 132,38" class="tri"/>
  <rect x="160" y="22" width="18" height="28" class="drop"/>
  <polygon points="164,32 174,32 169,40" class="caret"/>
  <text x="200" y="40" class="op">when value is</text>
  <!-- operator dropdown -->
  <rect x="295" y="22" width="38" height="28" class="drop"/>
  <text x="302" y="40">&gt;=</text>
  <rect x="333" y="22" width="18" height="28" class="drop"/>
  <polygon points="337,32 347,32 342,40" class="caret"/>
  <!-- value box -->
  <rect x="370" y="22" width="80" height="28" class="box"/>
  <text x="378" y="40">15000</text>
  <rect x="450" y="22" width="22" height="28" class="drop"/>
  <text x="455" y="42" font-size="14">&#9783;</text>
  <!-- type dropdown -->
  <rect x="510" y="22" width="80" height="28" class="drop"/>
  <text x="518" y="40">Number</text>
  <rect x="590" y="22" width="18" height="28" class="drop"/>
  <polygon points="594,32 604,32 599,40" class="caret"/>

  <!-- Row 2: Yellow -->
  <text x="0"   y="76" class="lbl" fill="#000">Yellow</text>
  <line x1="40" y1="72" x2="78" y2="72" stroke="#000" stroke-width="2"/>
  <polygon points="78,66 90,72 78,78" class="arrow"/>
  <rect x="100" y="58" width="60" height="28" class="icon"/>
  <polygon points="115,66 115,82 132,74" class="tri"/>
  <rect x="160" y="58" width="18" height="28" class="drop"/>
  <polygon points="164,68 174,68 169,76" class="caret"/>
  <text x="200" y="76" class="op">when &lt; 15000 and</text>
  <rect x="295" y="58" width="38" height="28" class="drop"/>
  <text x="302" y="76">&gt;=</text>
  <rect x="333" y="58" width="18" height="28" class="drop"/>
  <polygon points="337,68 347,68 342,76" class="caret"/>
  <rect x="370" y="58" width="80" height="28" class="box"/>
  <text x="378" y="76">10000</text>
  <rect x="450" y="58" width="22" height="28" class="drop"/>
  <text x="455" y="78" font-size="14">&#9783;</text>
  <rect x="510" y="58" width="80" height="28" class="drop"/>
  <text x="518" y="76">Number</text>
  <rect x="590" y="58" width="18" height="28" class="drop"/>
  <polygon points="594,68 604,68 599,76" class="caret"/>

  <!-- Row 3: Green -->
  <text x="0"   y="112" class="lbl" fill="#000">Green</text>
  <line x1="40" y1="108" x2="78" y2="108" stroke="#000" stroke-width="2"/>
  <polygon points="78,102 90,108 78,114" class="arrow"/>
  <rect x="100" y="94" width="60" height="28" class="icon"/>
  <polygon points="115,102 115,118 132,110" class="tri"/>
  <rect x="160" y="94" width="18" height="28" class="drop"/>
  <polygon points="164,104 174,104 169,112" class="caret"/>
  <text x="200" y="112" class="op">when &lt; 10000</text>
</svg>
