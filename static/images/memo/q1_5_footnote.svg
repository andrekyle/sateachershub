  <!-- short separator line above footnotes -->
  <line x1="14" y1="14" x2="120" y2="14" stroke="#222" stroke-width="0.8"/>
  <!-- footnote 1 -->
  <text x="14" y="36"><tspan font-size="8" baseline-shift="super">1</tspan> Zoo School</text>
